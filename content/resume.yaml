featured:
  title: 双臂机器人叠衣 · 具身智能 VLA 系统
  org: 视启未来（IDEA 研究院孵化）
  role: VLA 与世界模型算法实习生 · 具身智能团队
  period: "2026.04 - 至今"
  tagline: 从数据、训练、实时推理到真机部署的全链路具身智能落地
  summary: |
    以开源 π0.5 / X-VLA 为基座，为双臂 Agilex Piper 机器人构建"看图叠衣"的视觉-语言-动作
    （VLA）策略；覆盖数据采集、策略训练、离线评测、实时推理优化与真机部署全链路，并探索用
    里程碑世界模型为策略注入子目标先验。当前实习中的核心主项目。
  highlights:
    - title: 训练配方 SOTA
      desc: 数据精选 + 两阶段初始化做出新 SOTA 训练配方，动作误差 MAE@50 较原基线显著下降，并完成真机上机
    - title: 实时推理优化 8×
      desc: RTC 实时分块推理 + Triton kernel 优化，单步推理耗时约 256ms→32ms（约 8×），末端抖动降低 81%；主导 ROS1→ROS2 迁移
    - title: X-VLA 真机 bring-up
      desc: 将清华 X-VLA 迁到自有双臂平台，固件级 IK 把控制周期 1.4s→0.33s；建立离线视觉消融门禁，定位并修复"视觉失明"根因缺陷
    - title: 里程碑世界模型
      desc: 自研世界模型，零训练挖掘 milestone 子目标注入 VLA 动作专家，在 LIBERO / RoboTwin 仿真基准系统评测
