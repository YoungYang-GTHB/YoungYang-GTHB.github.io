name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAREER_REPO_TOKEN: ${{ secrets.CAREER_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout private profile source
        if: ${{ env.CAREER_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: YoungYang-GTHB/YoungYang-Resume
          token: ${{ env.CAREER_REPO_TOKEN }}
          path: .private-career

      - name: Install dependencies
        run: npm install

      - name: Prepare sanitized personal profile
        if: ${{ env.CAREER_REPO_TOKEN != '' }}
        run: |
          node scripts/prepare-public-site.mjs .private-career/site content/resume.public.yaml public
          echo "RESUME_DATA_PATH=content/resume.public.yaml" >> "$GITHUB_ENV"

      - name: Build (Next.js static export -> out/)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
