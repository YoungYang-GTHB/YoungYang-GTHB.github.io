# offer情报局 API 集成配置
# 可自由修改筛选条件，token 在 .token 文件中单独管理

api:
  base_url: "https://offerqingbaoju.cn/api"
  timeout: 30

# 目标数据源：导航ID和名称
# 可通过 fetch_jobs.py --list-navigations 查看所有可用数据源
navigations:
  - id: 61
    name: "27届秋招"
    enabled: true
  - id: 60
    name: "信息总表"
    enabled: true
  - id: 57
    name: "实习信息汇总"
    enabled: false

# 筛选条件（AND 逻辑，留空表示不做限制）
filters:
  # 硬性允许城市；留空表示不因城市漏掉高匹配岗位。
  cities: []
  # 偏好城市只加分，不做硬过滤。
  preferred_cities:
    - 杭州
    - 上海
    - 深圳
    - 西安
    - 苏州
    - 广州
    - 成都
    - 北京
  # 排除城市（包含匹配）
  exclude_cities: []
  # 目标行业关键词（包含匹配）
  industries:
    - 机器人
    - 半导体
    - 嵌入式
    - 自动
    - 汽车
    - 电子
    - 通信
    - 互联网
    - 高端装备
    - 国防
    - AI
    - 人工
    - 智能
    - 控制
  # 排除行业
  exclude_industries:
    - 教育
    - 金融
    - 房地产
    - 医疗
    - 餐饮
    - 零售
  # 学历要求关键词
  education_keywords:
    - 硕士
    - 本科及
    - 详见公告
  # 毕业年份
  graduation_year: "2027"
  # 公司性质偏好
  company_types: []  # 留空等于不限，可填: 民企, 央国企, 外企

  # 岗位相关性：具身为主线，嵌入式与机器人系统为支线。
  matching:
    primary_keywords:
      - 具身智能
      - VLA
      - 世界动作模型
      - WAM
      - 世界模型
      - Robot Learning
      - 机器人学习
      - 强化学习
      - 模仿学习
      - 灵巧操作
      - Manipulation
      - 多模态
      - 真机部署
    secondary_keywords:
      - ROS
      - ROS2
      - 机器人系统
      - 运动规划
      - 决策规划
      - 推理优化
      - CUDA
      - Triton
      - 嵌入式
      - Linux
      - Yocto
      - STM32
    deprioritize_keywords:
      - 销售
      - 财务
      - 运营
      - 市场营销
      - 教师
      - 客户经理

# 输出配置
output:
  directory: "output"
  format: "jsonl"  # jsonl 用于 Job OK 流程
  max_per_source: 1000  # 单个用户选择的数据源上限，覆盖当前 719 条导航

# 缓存配置
cache:
  enabled: true
  ttl_minutes: 60  # 缓存有效期

# 求职工作流策略（供后续筛选、归档和投递流程统一读取）
workflow:
  generate_job_specific_resume: false
  ask_before_resume_customization: false
  resume_templates:
    embodied_ai: "public/resume.pdf"
    embedded: "public/resume-embedded.pdf"
  referral_channel_first: true
  final_submission_requires_confirmation: true
  early_batch_policy:
    confirmed_no_autumn_impact: "safe_to_progress"
    unknown_autumn_impact: "cautious_verify_before_submission"
    confirmed_affects_autumn: "hold_unless_explicit_exception"
